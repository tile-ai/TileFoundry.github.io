site_name: TileFoundry
site_url: https://tile-ai.github.io/TileFoundry.github.io/
site_description: A tile-based, agentic platform for automatic high-performance program generation across hardware.
repo_url: https://github.com/tile-ai/TileFoundry
repo_name: tile-ai/TileFoundry

theme:
  name: material
  logo: assets/tilefoundry-logo.png
  favicon: assets/tilefoundry-logo.png
  language: en
  font:
    text: Hanken Grotesk
    code: Cascadia Code
  palette:
    scheme: default
    primary: red
    accent: deep orange
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

exclude_docs: |
  assets/data/qwen35-flywheel-session.jsonl
  assets/mark.svg
  javascripts/session-player.js
  plans/
  policies/
  reports/

hooks:
  - hooks/repo_links.py

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 4

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  # The query is a cache buster: this path carries no build fingerprint the
  # way the theme's own assets do, so bump it whenever the stylesheet changes.
  - stylesheets/extra.css?v=20261030

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
      - AI Compilers in the Agentic Era: blog/AI-compilers-in-the-agentic-era.md
      - "The TileFoundry Schedule: Built for Agents to Solve": blog/schedule-built-for-agents-to-solve.md
  - Tutorial:
      - Overview: tutorial/index.md
      - Describing a published step: tutorial/migrate.md
      - Making one step fast: tutorial/optimize.md
      - Choosing schedules and instructions: tutorial/schedule.md
      - Putting it all to work: tutorial/showcase.md
  - Specifications:
      - Architecture: spec/architecture.md
      - Core IR: spec/core-ir.md
      - HIR: spec/hir.md
      - TIR: spec/tir.md
      - Type system: spec/types.md
      - Shard and layout: spec/shard.md
      - Parser: spec/parser.md
      - Semantic analysis: spec/semantic-analysis.md
      - Analysis: spec/analysis.md
      - Schedule: spec/schedule.md
      - Passes: spec/passes.md
      - Target: spec/target.md
      - Code generation: spec/codegen.md
      - Runtime: spec/runtime.md
      - Evaluator: spec/evaluator.md
      - Inspection: spec/inspection.md
      - Visitor and mutator: spec/visitor-mutator.md
      - Visitor registry: spec/visitor-registry.md
      - Command-line interface: spec/cli.md
      - Code organization: spec/code-organization.md
      - Spec rules: SPEC-RULES.md
  - Development: develop.md

copyright: Copyright &copy; 2026 TileFoundry contributors
