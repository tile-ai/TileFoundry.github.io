name: Publish TileFoundry Site

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: One-off TileFoundry branch, tag, or SHA; empty renders the ref pinned in upstream-ref
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: tile-ai/TileFoundry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v7
        with:
          path: pages

      - name: Resolve the TileFoundry ref to render
        id: source
        run: |
          ref='${{ inputs.source_ref }}'
          if [[ -z "$ref" ]]; then
            ref="$(grep -vE '^[[:space:]]*(#|$)' pages/upstream-ref | head -1 | tr -d '[:space:]')"
          fi
          if [[ -z "$ref" ]]; then
            printf 'No source_ref given and pages/upstream-ref names none\n' >&2
            exit 1
          fi
          printf 'Rendering TileFoundry %s\n' "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout TileFoundry source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          persist-credentials: false
          token: ${{ secrets.TILEFOUNDRY_READ_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pages/site/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement pages/site/requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble documentation source
        id: assemble
        run: |
          assembled_source="$(mktemp -d)/source"
          bash pages/scripts/assemble-site.sh upstream pages/site "$assembled_source" \
            '${{ steps.source.outputs.ref }}'
          echo "source=$assembled_source" >> "$GITHUB_OUTPUT"

      - name: Build documentation site
        env:
          # hooks/repo_links.py points links that leave docs/ at this ref.
          TILEFOUNDRY_REF: ${{ steps.source.outputs.ref }}
        run: mkdocs build --strict --config-file "${{ steps.assemble.outputs.source }}/mkdocs.yml" --site-dir "$RUNNER_TEMP/site"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
